<!-- Draggable Support Floating Canvas Hub Element -->

  <!-- Form Field Input Parameters Container -->
  <div style="padding: 24px; display: flex; flex-direction: column; box-sizing: border-box;" id="chat-preflight-input-form">

      <div class="wizard-input-group">
        <label for="chat_first_name" style="font-size: 0.75rem; font-weight: 700; text-transform: uppercase; color: #64748b;">First Name</label>
        <input type="text" id="chat_first_name" required class="wizard-input-field" placeholder="John" style="width: 100%; height: 40px; padding: 0 12px; border-radius: 6px; border: 1px solid #cbd5e1; box-sizing: border-box;">
      </div>
      <div class="wizard-input-group">
        <label for="chat_last_name" style="font-size: 0.75rem; font-weight: 700; text-transform: uppercase; color: #64748b;">Last Name</label>
        <input type="text" id="chat_last_name" required class="wizard-input-field" placeholder="Doe" style="width: 100%; height: 40px; padding: 0 12px; border-radius: 6px; border: 1px solid #cbd5e1; box-sizing: border-box;">
      </div>
      <div class="wizard-input-group">
        <label for="chat_phone" style="font-size: 0.75rem; font-weight: 700; text-transform: uppercase; color: #64748b;">Phone Number</label>
        <input type="tel" id="chat_phone" required class="wizard-input-field" placeholder="(555) 000-0000" style="width: 100%; height: 40px; padding: 0 12px; border-radius: 6px; border: 1px solid #cbd5e1; box-sizing: border-box;">
      </div>
      <div class="wizard-input-group">
        <label for="chat_email" style="font-size: 0.75rem; font-weight: 700; text-transform: uppercase; color: #64748b;">Business Email</label>
        <input type="email" id="chat_email" required class="wizard-input-field" placeholder="john@company.com" style="width: 100%; height: 40px; padding: 0 12px; border-radius: 6px; border: 1px solid #cbd5e1; box-sizing: border-box;">
