name: Build and Deploy Enterprise Static Pages

on:
  push:
    branches:
      - main

# 🔴 CRITICAL STEP: Opt-in completely to the secure Node 24 runtime engine environment
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Pull down pristine source code metrics from main branch safely
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 2. Bind the runtime environment cleanly to the targeted Node 24 engine
      - name: Setup Enterprise Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm' # Removes execution lag if you use a package framework

      # 3. Clean install tracking dependencies
      - name: Install System Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      # 4. Fire the single file pipeline automation engine to render your 43+ pages
      - name: Execute Mass Landing Compilation Matrix
        run: node generate.js

      # 5. Push compiled static assets cleanly onto your hosting environment
      - name: Deploy Compiled Infrastructure Assets
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          git add .
          git diff-index --quiet HEAD || git commit -m "chore(ci): automated production mass page compilation loop"
          git push origin main
