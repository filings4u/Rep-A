<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#10b981">
  <title>Get Started &amp; Compliance Portal | filings4u</title>
  
  <!-- UNIFIED RESPONSIVE GLOBAL STYLESHEET -->
  <link rel="stylesheet" href="assets/css/master.css">
  <link rel="stylesheet" href="assets/css/master-mobile.css">
  <link rel="icon" type="image/png" href="images/fav.png">
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/master.js"></script>
  <script src="assets/js/state-pricing.js"></script>
  
  <!-- DATA ARCHITECTURE CATALOG DEPLOYMENTS -->
  <script src="assets/js/metrics-catalog.js"></script>
  <script src="assets/js/content-engine.js"></script>
  <script src="assets/js/subscription-listener.js"></script>
</head>
<body style="margin: 0; padding: 0; background-color: #f8fafc; font-family: system-ui, sans-serif; color: #0f172a;">
  <script src="assets/js/toggle.js"></script>




  <!-- FRONTEND LAYOUT TARGET CONNECTIONS -->
<div id="global-platform-navigation-zone"></div>

<!-- 🌟 AUTOMATED SYSTEM BOUNDS -->
<div id="get-started-hero-zone"></div>
<div id="get-started-metrics-zone"></div>
<!-- 🏢 CUSTOM TARGET: Main width-limiting block constrained to 1450px -->
<div id="get-started-universal-pricing-grid-root" style="max-width: 1450px; margin: 40px auto 60px auto; padding: 0 24px; box-sizing: border-box; width: 100%;">
  <div style="border-bottom: 1px solid #e2e8f0; padding-bottom: 16px; margin-bottom: 24px; text-align: left;">
    <h2 style="color: #0a1f44; font-size: 1.35rem; font-weight: 800; margin: 0; letter-spacing: -0.3px;">Explore Our Compliance Setup Solutions</h2>
    <p style="color: #64748b; font-size: 0.85rem; margin: 4px 0 0 0;">Compare available starter rates across our dynamic system service index catalog layers.</p>
  </div>

  <!-- Unified Card Injector: Corrected duplicate ID clashing. Uses the compact 220px dense matrix style layout -->
  <div id="universal-matrix-cards-injection-box" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; width: 100%; box-sizing: border-box;">
    <!-- Compiled script blocks drop items programmatically here on browser initialization -->
  </div>
</div>


<div id="dynamic-subscribe-placement-zone"></div>
<div id="global-platform-footer-zone"></div>
<!-- /FRONTEND LAYOUT TARGET CONNECTIONS -->



     <script>
    document.addEventListener("DOMContentLoaded", function() {
      const parentTargetBox = document.getElementById("universal-matrix-cards-injection-box");
      if (!parentTargetBox) return;

      const dataSource = window.CENTRAL_SERVICE_PLAN_DB || {};
      let compiledMarkup = "";

      for (const serviceKey in dataSource) {
        if (!dataSource.hasOwnProperty(serviceKey)) continue;

        const dataNode = dataSource[serviceKey];
        const baseName = dataNode.name || serviceKey.split("-").map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(" ");
        const starterVal = parseFloat(dataNode.starter) || 0;

        compiledMarkup += `
          <div class="pricing-card-node text-center-mobile" style="background: #ffffff; border: 1px solid #e2e8f0; border-top: 3px solid #0a1f44; border-radius: 8px; padding: 16px; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 2px 8px rgba(10,31,68,0.02); height: 100%; box-sizing: border-box; transition: transform 0.15s ease-in-out;" onmouseover="this.style.transform='translateY(-2px)';" onmouseout="this.style.transform='translateY(0)';">
            <div class="pricing-card-upper-content" style="text-align: left; width: 100%;">
              <h3 class="pricing-card-tier-title" style="color: #0a1f44; font-size: 0.875rem; font-weight: 800; margin: 0 0 10px 0; min-height: 36px; display: flex; align-items: center; line-height: 1.3;">${baseName}</h3>
              <div class="pricing-card-rate-row" style="margin-bottom: 12px; display: flex; align-items: baseline; gap: 4px;">
                <span class="pricing-card-price-integer" style="font-size: 1.35rem; font-weight: 800; color: #0a1f44; font-family: monospace;">$${starterVal.toFixed(2)}</span>
                <span class="pricing-card-cadence-label" style="font-size: 0.75rem; color: #64748b; font-weight: 500;">/ base</span>
              </div>
            </div>
            <a href="wizard.html?service=${serviceKey}&plan=starter" class="pricing-card-action-btn starter-btn-theme" style="background: #0a1f44; color: #ffffff; padding: 10px; border-radius: 6px; text-decoration: none; font-weight: 700; text-align: center; display: block; font-size: 0.8rem; margin-top: auto; border: none; cursor: pointer; transition: background 0.1s;">Initialize Setup &rarr;</a>
          </div>
        `;
      }

      parentTargetBox.innerHTML = compiledMarkup;
      console.log("[Aggregator Engine] Successfully mounted compiled services matrix cards.");
    });
  </script>
</body>
</html>
