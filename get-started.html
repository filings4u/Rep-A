<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#10b981">
  <title>Get Started &amp; Compliance Portal | filings4u</title>
  
  <!-- UNIFIED RESPONSIVE GLOBAL STYLESHEET -->
  <link rel="stylesheet" href="assets/css/master.css">
  <link rel="stylesheet" href="assets/css/master-mobile.css">
  <link rel="icon" type="image/png" href="images/fav.png">
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/master.js"></script>
  <script src="assets/js/state-pricing.js"></script>
  
  <!-- DATA ARCHITECTURE CATALOG DEPLOYMENTS -->
  <script src="assets/js/metrics-catalog.js"></script>
  <script src="assets/js/content-engine.js"></script>
  <script src="assets/js/subscription-listener.js"></script>
</head>
<body style="margin: 0; padding: 0; background-color: #f8fafc; font-family: system-ui, sans-serif; color: #0f172a;">
  <script src="assets/js/toggle.js"></script>
  <!-- FRONTEND LAYOUT TARGET CONNECTIONS -->
  <div id="global-platform-navigation-zone"></div>
  
  <!-- 🌟 AUTOMATED SYSTEM BOUNDS -->
  <!-- Throws the smooth margin-top: 120px and bottom padding parameters -->
  <div id="get-started-hero-zone"></div>
  
  <!-- Displays the 3-column performance counters matrix dynamically -->
  <div id="get-started-metrics-zone"></div>
  <!-- Renders out your dynamic 3-card landing page pricing arrays -->
  <div id="universal-matrix-cards-injection-box" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; width: 100%; box-sizing: border-box;"></div>
  
  <!-- Renders the on-demand concierge stream feed activity logs -->
  <div id="get-started-launchpad-zone"></div>
  
  <!-- Mounts the institutional audit trust shield asset matrices -->
  <div id="get-started-trust-zone"></div>
  <!-- Dynamic subscription email capture field block -->
  <div id="dynamic-subscribe-placement-zone"></div>
  
  <!-- Global site footer target zone connection -->
  <div id="global-platform-footer-zone"></div>
  <!-- /FRONTEND LAYOUT TARGET CONNECTIONS -->


   <script>
    document.addEventListener("DOMContentLoaded", function() {
      const parentTargetBox = document.getElementById("universal-matrix-cards-injection-box");
      if (!parentTargetBox) return;

      const dataSource = window.CENTRAL_SERVICE_PLAN_DB || {};
      let compiledMarkup = "";

      for (const serviceKey in dataSource) {
        if (!dataSource.hasOwnProperty(serviceKey)) continue;

        const dataNode = dataSource[serviceKey];
        const baseName = dataNode.name || serviceKey.split("-").map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(" ");
        const starterVal = parseFloat(dataNode.starter) || 0;

        compiledMarkup += `
          <div class="pricing-card-node text-center-mobile" style="background: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 24px; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 4px 12px rgba(10,31,68,0.01); height: 100%; box-sizing: border-box;">
            <div class="pricing-card-upper-content" style="text-align: left;">
              <h3 class="pricing-card-tier-title" style="color: #0a1f44; font-size: 1.05rem; font-weight: 800; margin: 0 0 8px 0; min-height: 44px; display: flex; align-items: center;">${baseName}</h3>
              <div class="pricing-card-rate-row" style="margin-bottom: 14px;">
                <span class="pricing-card-price-integer" style="font-size: 1.6rem; font-weight: 800; color: #0a1f44; font-family: monospace;">$${starterVal.toFixed(2)}</span>
                <span class="pricing-card-cadence-label" style="font-size: 0.8rem; color: #64748b;"> / plan entry</span>
              </div>
            </div>
            <a href="wizard.html?service=${serviceKey}&plan=starter" class="pricing-card-action-btn starter-btn-theme" style="background: #0a1f44; color: #ffffff; padding: 12px; border-radius: 6px; text-decoration: none; font-weight: 700; text-align: center; display: block; font-size: 0.85rem; margin-top: auto; border: none; cursor: pointer;">Initialize Setup &rarr;</a>
          </div>
        `;
      }

      parentTargetBox.innerHTML = compiledMarkup;
      console.log("[Aggregator Engine] Successfully mounted compiled services matrix cards.");
    });
  </script>
</body>
</html>
